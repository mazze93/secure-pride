name: Release — Docker build, scan & push

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'     # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # v1.2.3-rc1, v1.2.3-beta.2, etc.
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Also tag :latest'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUSH_LATEST: ${{ github.event_name == 'push' || inputs.push_latest }}

permissions:
  contents: read
  packages: write

jobs:
  scan:
    name: Build (single-arch) & scan before anything is pushed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  build-push:
    name: Build & push multi-platform image
    needs: scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is minted fresh per workflow run and expires when the
      # run ends — there is no long-lived credential here to rotate, leak,
      # or forget. This replaces the old Docker Hub PAT + monthly manual
      # rotation entirely; see docs/DOCKER_IMAGE_WORKFLOW.md for the
      # migration note.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ env.PUSH_LATEST }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "Pushed $IMAGE_TAGS"
